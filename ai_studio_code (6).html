<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>مطبخ ست البيت | المنيو الإلكتروني</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #c2410c;
      --primary-light: #fff7ed;
      --gold: #d97706;
      --dark: #1c1917;
      --bg: #faf7f2;
      --card: #ffffff;
      --text: #1f2937;
      --muted: #6b7280;
      --green: #16a34a;
      --border: #ede9e0;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Cairo', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      padding-bottom: 100px;
    }

    /* الهيدر بصورة بانر */
    .hero {
      position: relative;
      height: 195px;
      background: linear-gradient(to top, rgba(28, 25, 23, 0.94) 15%, rgba(28, 25, 23, 0.45) 100%),
                  url('https://images.unsplash.com/photo-1504674900247-0877df9cc836?w=900&auto=format&fit=crop&q=80') center/cover no-repeat;
      color: #fff;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      padding: 18px 16px;
      border-bottom-left-radius: 26px;
      border-bottom-right-radius: 26px;
      box-shadow: 0 6px 20px rgba(0,0,0,0.12);
    }

    .hero-badges {
      display: flex;
      gap: 8px;
      margin-bottom: 8px;
      flex-wrap: wrap;
    }

    .badge-open {
      background: rgba(22, 163, 74, 0.9);
      color: #fff;
      padding: 3px 10px;
      border-radius: 20px;
      font-size: 0.72rem;
      font-weight: 700;
    }

    .badge-rate {
      background: rgba(255, 255, 255, 0.18);
      backdrop-filter: blur(6px);
      color: #fde68a;
      padding: 3px 10px;
      border-radius: 20px;
      font-size: 0.72rem;
      font-weight: 700;
    }

    .store-name {
      font-size: 1.45rem;
      font-weight: 900;
      line-height: 1.25;
      margin-bottom: 4px;
    }

    .store-desc {
      font-size: 0.82rem;
      color: #e7e5e4;
      opacity: 0.95;
    }

    /* شريط البحث */
    .search-wrap {
      padding: 14px 16px 4px;
    }

    .search-input {
      width: 100%;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 10px 14px;
      font-size: 0.88rem;
      outline: none;
      box-shadow: 0 2px 6px rgba(0,0,0,0.03);
    }

    .search-input:focus {
      border-color: var(--primary);
    }

    /* شريط الأقسام */
    .categories {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding: 12px 16px 8px;
      scrollbar-width: none;
      position: sticky;
      top: 0;
      background: var(--bg);
      z-index: 20;
    }
    .categories::-webkit-scrollbar { display: none; }

    .cat-btn {
      background: var(--card);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 7px 15px;
      border-radius: 22px;
      font-size: 0.84rem;
      font-weight: 700;
      white-space: nowrap;
      cursor: pointer;
      transition: 0.2s;
    }

    .cat-btn.active {
      background: var(--primary);
      color: #fff;
      border-color: var(--primary);
      box-shadow: 0 4px 10px rgba(194, 65, 12, 0.25);
    }

    /* قائمة الأكلات */
    .menu-list {
      padding: 6px 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .item-card {
      background: var(--card);
      border-radius: 18px;
      padding: 11px;
      display: flex;
      align-items: center;
      gap: 12px;
      box-shadow: 0 3px 12px rgba(28, 25, 23, 0.05);
      border: 1px solid var(--border);
      position: relative;
    }

    .item-img-box {
      width: 92px;
      height: 92px;
      border-radius: 14px;
      background: var(--primary-light);
      flex-shrink: 0;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.3rem;
      position: relative;
    }

    .item-img-box img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .popular-tag {
      position: absolute;
      top: 6px;
      right: 6px;
      background: rgba(194, 65, 12, 0.92);
      color: #fff;
      font-size: 0.65rem;
      font-weight: 800;
      padding: 2px 7px;
      border-radius: 8px;
    }

    .item-info {
      flex: 1;
      min-width: 0;
    }

    .item-title {
      font-size: 0.96rem;
      font-weight: 800;
      color: var(--dark);
      margin-bottom: 3px;
    }

    .item-desc {
      font-size: 0.76rem;
      color: var(--muted);
      margin-bottom: 8px;
      line-height: 1.4;
    }

    .item-bottom {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .item-price {
      font-size: 0.98rem;
      font-weight: 900;
      color: var(--primary);
    }

    .add-btn {
      background: var(--primary);
      color: #fff;
      border: none;
      padding: 6px 14px;
      border-radius: 11px;
      font-size: 0.82rem;
      font-weight: 700;
      cursor: pointer;
    }

    .qty-controls {
      display: flex;
      align-items: center;
      gap: 7px;
      background: var(--primary-light);
      padding: 3px 6px;
      border-radius: 11px;
      border: 1px solid #fed7aa;
    }

    .qty-btn {
      width: 26px;
      height: 26px;
      border-radius: 8px;
      border: none;
      background: #fff;
      color: var(--primary);
      font-size: 1rem;
      font-weight: 800;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .qty-btn.plus {
      background: var(--primary);
      color: #fff;
    }

    .qty-num {
      font-weight: 800;
      font-size: 0.88rem;
      min-width: 16px;
      text-align: center;
    }

    /* شريط السلة السفلي */
    .cart-bar {
      position: fixed;
      bottom: 14px;
      left: 16px;
      right: 16px;
      background: linear-gradient(135deg, var(--primary), var(--gold));
      color: #fff;
      padding: 14px 18px;
      border-radius: 18px;
      display: none;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 10px 25px rgba(194, 65, 12, 0.38);
      cursor: pointer;
      z-index: 50;
    }

    .cart-bar.show {
      display: flex;
    }

    .cart-bar-left {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 800;
      font-size: 0.92rem;
    }

    .cart-count {
      background: rgba(255,255,255,0.25);
      padding: 2px 10px;
      border-radius: 10px;
      font-size: 0.85rem;
    }

    .cart-total {
      font-weight: 900;
      font-size: 1.02rem;
    }

    /* نافذة تأكيد الطلب */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.6);
      display: none;
      align-items: flex-end;
      z-index: 100;
    }

    .modal-overlay.open {
      display: flex;
    }

    .modal-sheet {
      background: #fff;
      width: 100%;
      max-height: 90vh;
      overflow-y: auto;
      border-top-left-radius: 26px;
      border-top-right-radius: 26px;
      padding: 20px 18px 26px;
      animation: slideUp 0.25s ease;
    }

    @keyframes slideUp {
      from { transform: translateY(100%); }
      to { transform: translateY(0); }
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--border);
    }

    .close-btn {
      background: #f3f4f6;
      border: none;
      width: 34px;
      height: 34px;
      border-radius: 50%;
      font-size: 1.1rem;
      cursor: pointer;
    }

    .summary-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.88rem;
      padding: 8px 0;
      border-bottom: 1px dashed var(--border);
      gap: 8px;
    }

    .summary-total {
      display: flex;
      justify-content: space-between;
      font-size: 1.08rem;
      font-weight: 900;
      margin: 12px 0 16px;
      color: var(--primary);
      background: var(--primary-light);
      padding: 10px 14px;
      border-radius: 12px;
    }

    .form-group {
      margin-bottom: 12px;
    }

    .form-group label {
      display: block;
      font-size: 0.83rem;
      font-weight: 700;
      margin-bottom: 5px;
      color: var(--dark);
    }

    .form-group input, .form-group textarea, .form-group select {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #d1d5db;
      border-radius: 12px;
      font-size: 0.88rem;
      outline: none;
      background: #fff;
    }

    .form-group input:focus, .form-group textarea:focus, .form-group select:focus {
      border-color: var(--primary);
    }

    .whatsapp-btn {
      width: 100%;
      background: var(--green);
      color: #fff;
      border: none;
      padding: 14px;
      border-radius: 14px;
      font-size: 1rem;
      font-weight: 800;
      cursor: pointer;
      margin-top: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 0 6px 16px rgba(22, 163, 74, 0.25);
    }

    .empty-msg {
      text-align: center;
      padding: 30px;
      color: var(--muted);
      font-size: 0.9rem;
    }
  </style>
</head>
<body>

  <header class="hero">
    <div class="hero-badges">
      <span class="badge-open">● مفتوح للطلبات الآن</span>
      <span class="badge-rate">⭐ 4.9 • أكل بيتي طازة</span>
    </div>
    <h1 class="store-name" id="storeName"></h1>
    <p class="store-desc" id="storeDesc"></p>
  </header>

  <div class="search-wrap">
    <input type="text" class="search-input" id="searchInput" placeholder="🔍 ابحث عن أكلة (مثال: فراخ، مكرونة، كيك)..." oninput="renderMenu()" />
  </div>

  <div class="categories" id="categoriesBar"></div>

  <main class="menu-list" id="menuList"></main>

  <div class="cart-bar" id="cartBar" onclick="openCheckout()">
    <div class="cart-bar-left">
      <span class="cart-count" id="cartCount">0</span>
      <span>مراجعة الطلب والإرسال لواتساب</span>
    </div>
    <div class="cart-total" id="cartTotal">0 ج.م</div>
  </div>

  <div class="modal-overlay" id="checkoutModal">
    <div class="modal-sheet">
      <div class="modal-header">
        <h3>📋 تفاصيل طلبك</h3>
        <button class="close-btn" onclick="closeCheckout()">✕</button>
      </div>

      <div id="orderSummary"></div>
      <div class="summary-total">
        <span>الإجمالي المطلوب:</span>
        <span id="modalTotal">0 ج.م</span>
      </div>

      <div class="form-group">
        <label>الاسم بالكامل *</label>
        <input type="text" id="custName" placeholder="اكتب اسمك هنا" />
      </div>

      <div class="form-group">
        <label>العنوان بالتفصيل *</label>
        <input type="text" id="custAddress" placeholder="المنطقة - الشارع - رقم العمارة والشقة" />
      </div>

      <div class="form-group">
        <label>طريقة الدفع المفضلة</label>
        <select id="payMethod">
          <option value="كاش عند الاستلام">💵 كاش عند الاستلام</option>
          <option value="فودافون كاش / إنستاباي">📱 تحويل فودافون كاش أو إنستاباي</option>
        </select>
      </div>

      <div class="form-group">
        <label>ملاحظات إضافية (اختياري)</label>
        <textarea id="custNotes" rows="2" placeholder="مثال: التوصيل الساعة 4 / بدون شطة"></textarea>
      </div>

      <button class="whatsapp-btn" onclick="sendToWhatsApp()">
        <span>إرسال الطلب على واتساب الآن</span> 📲
      </button>
    </div>
  </div>

  <script>
    // ==========================================
    // إعدادات المنيو (تعديلها سهل جداً لأي عميل)
    // ==========================================
    const CONFIG = {
      storeName: "مطبخ ست البيت الأصلي",
      storeDesc: "أشهى الأكلات البيتي بالسمن البلدي • تجهيز يومي طازج لباب بيتك 🍲",
      whatsapp: "201017197034", // رقمك جاهز للتجربة!
      categories: ["الكل", "مشويات وفراخ", "طواجن وأطباق", "حلويات بيتي"],
      items: [
        {
          id: 1,
          name: "فراخ مشوية بتتبيلة الحاتي",
          desc: "فرخة كاملة مشوية بالفرن على نار هادية مع صوص التتبيلة البيتي",
          price: 260,
          category: "مشويات وفراخ",
          popular: true,
          icon: "🍗",
          image: "https://images.unsplash.com/photo-1604908177522-40224c0c6e4a?w=500&auto=format&fit=crop&q=80"
        },
        {
          id: 2,
          name: "وجبة أرز بسمتي بالفراخ والمكسرات",
          desc: "أرز بسمتي متبل بالبهارات الشرقية مع قطع فراخ مشوية",
          price: 165,
          category: "طواجن وأطباق",
          popular: true,
          icon: "🍛",
          image: "https://images.unsplash.com/photo-1589302168068-964664d93dc0?w=500&auto=format&fit=crop&q=80"
        },
        {
          id: 3,
          name: "صينية مكرونة بشاميل بيتي",
          desc: "غرقانة بشاميل كريمي ولحمة مفرومة بلدي (تكفي 4 أفراد)",
          price: 210,
          category: "طواجن وأطباق",
          popular: false,
          icon: "🍝",
          image: "https://images.unsplash.com/photo-1473093295043-cdd812d0e601?w=500&auto=format&fit=crop&q=80"
        },
        {
          id: 4,
          name: "مشويات لحم بلدي مشكل",
          desc: "قطع لحم مشوية طرية متبلة مع خضار مشوي وسلطة طحينة",
          price: 340,
          category: "مشويات وفراخ",
          popular: true,
          icon: "🥩",
          image: "https://images.unsplash.com/photo-1600891964599-f61ba0e24092?w=500&auto=format&fit=crop&q=80"
        },
        {
          id: 5,
          name: "دبابيس وأجنحة فراخ مقرمشة",
          desc: "متبلة 24 ساعة ومقرمشة مع صوص باربكيو أو ثومية بيتي",
          price: 150,
          category: "مشويات وفراخ",
          popular: false,
          icon: "🍗",
          image: "https://images.unsplash.com/photo-1608039829572-f8d0d646ff5f?w=500&auto=format&fit=crop&q=80"
        },
        {
          id: 6,
          name: "بوكس سلطات ومقبلات طازة",
          desc: "تشكيلة خضار طازج مع صوص الليمون وزيت الزيتون",
          price: 75,
          category: "طواجن وأطباق",
          popular: false,
          icon: "🥗",
          image: "https://images.unsplash.com/photo-1546069901-ba9599a7e63c?w=500&auto=format&fit=crop&q=80"
        },
        {
          id: 7,
          name: "طاجن مولتن لافا كيك شوكولاتة",
          desc: "كيك دافئ محشو شوكولاتة سايحة فاخرة",
          price: 85,
          category: "حلويات بيتي",
          popular: true,
          icon: "🍫",
          image: "https://images.unsplash.com/photo-1624353365286-3f8d62daad51?w=500&auto=format&fit=crop&q=80"
        },
        {
          id: 8,
          name: "تشيز كيك فراولة بيتي",
          desc: "طبقة بسكوت مقرمشة وكريمة غنية بصوص الفراولة الطازة",
          price: 95,
          category: "حلويات بيتي",
          popular: false,
          icon: "🍰",
          image: "https://images.unsplash.com/photo-1533134486753-c833f0ed4866?w=500&auto=format&fit=crop&q=80"
        }
      ]
    };

    // ==========================================
    // كود التشغيل
    // ==========================================
    let currentCategory = "الكل";
    let cart = {};

    document.getElementById("storeName").textContent = CONFIG.storeName;
    document.getElementById("storeDesc").textContent = CONFIG.storeDesc;

    function renderCategories() {
      const bar = document.getElementById("categoriesBar");
      bar.innerHTML = CONFIG.categories.map(cat => `
        <button class="cat-btn ${cat === currentCategory ? 'active' : ''}" onclick="selectCategory('${cat}')">
          ${cat}
        </button>
      `).join("");
    }

    function selectCategory(cat) {
      currentCategory = cat;
      renderCategories();
      renderMenu();
    }

    function renderMenu() {
      const list = document.getElementById("menuList");
      const query = document.getElementById("searchInput").value.trim().toLowerCase();

      const filtered = CONFIG.items.filter(item => {
        const matchCat = currentCategory === "الكل" || item.category === currentCategory;
        const matchSearch = item.name.toLowerCase().includes(query) || item.desc.toLowerCase().includes(query);
        return matchCat && matchSearch;
      });

      if (filtered.length === 0) {
        list.innerHTML = `<div class="empty-msg">مفيش أكلات بالاسم ده حالياً.. جرب تبحث بكلمة تانية 😊</div>`;
        return;
      }

      list.innerHTML = filtered.map(item => {
        const qty = cart[item.id] || 0;
        const popularBadge = item.popular ? `<span class="popular-tag">🔥 الأكثر طلباً</span>` : "";

        const controls = qty === 0
          ? `<button class="add-btn" onclick="updateQty(${item.id}, 1)">+ أضف</button>`
          : `<div class="qty-controls">
               <button class="qty-btn" onclick="updateQty(${item.id}, -1)">-</button>
               <span class="qty-num">${qty}</span>
               <button class="qty-btn plus" onclick="updateQty(${item.id}, 1)">+</button>
             </div>`;

        return `
          <div class="item-card">
            <div class="item-img-box">
              ${item.image ? `<img src="${item.image}" alt="${item.name}" onerror="this.parentElement.innerHTML='${item.icon}'">` : item.icon}
              ${popularBadge}
            </div>
            <div class="item-info">
              <div class="item-title">${item.name}</div>
              <div class="item-desc">${item.desc}</div>
              <div class="item-bottom">
                <div class="item-price">${item.price} ج.م</div>
                ${controls}
              </div>
            </div>
          </div>
        `;
      }).join("");
    }

    function updateQty(id, change) {
      const newQty = (cart[id] || 0) + change;
      if (newQty <= 0) delete cart[id];
      else cart[id] = newQty;
      renderMenu();
      updateCartBar();
      if (document.getElementById("checkoutModal").classList.contains("open")) {
        if (getCartStats().count === 0) closeCheckout();
        else renderCheckoutItems();
      }
    }

    function getCartStats() {
      let count = 0;
      let total = 0;
      for (const id in cart) {
        const item = CONFIG.items.find(i => i.id == id);
        if (item) {
          count += cart[id];
          total += item.price * cart[id];
        }
      }
      return { count, total };
    }

    function updateCartBar() {
      const { count, total } = getCartStats();
      const bar = document.getElementById("cartBar");
      if (count > 0) {
        document.getElementById("cartCount").textContent = count;
        document.getElementById("cartTotal").textContent = `${total} ج.م`;
        bar.classList.add("show");
      } else {
        bar.classList.remove("show");
      }
    }

    function renderCheckoutItems() {
      const summary = document.getElementById("orderSummary");
      let html = "";
      for (const id in cart) {
        const item = CONFIG.items.find(i => i.id == id);
        if (item) {
          html += `
            <div class="summary-item">
              <span style="flex:1; font-weight:600;">${item.name}</span>
              <div class="qty-controls" style="padding:2px 5px;">
                <button class="qty-btn" style="width:22px;height:22px;" onclick="updateQty(${item.id}, -1)">-</button>
                <span class="qty-num">${cart[id]}</span>
                <button class="qty-btn plus" style="width:22px;height:22px;" onclick="updateQty(${item.id}, 1)">+</button>
              </div>
              <strong style="min-width:65px; text-align:left;">${item.price * cart[id]} ج.م</strong>
            </div>
          `;
        }
      }
      summary.innerHTML = html;
      document.getElementById("modalTotal").textContent = `${getCartStats().total} ج.م`;
    }

    function openCheckout() {
      renderCheckoutItems();
      document.getElementById("checkoutModal").classList.add("open");
    }

    function closeCheckout() {
      document.getElementById("checkoutModal").classList.remove("open");
    }

    function sendToWhatsApp() {
      const name = document.getElementById("custName").value.trim();
      const address = document.getElementById("custAddress").value.trim();
      const payMethod = document.getElementById("payMethod").value;
      const notes = document.getElementById("custNotes").value.trim();

      if (!name || !address) {
        alert("من فضلك اكتب الاسم والعنوان بالتفصيل عشان نقدر نوصّل الطلب 😊");
        return;
      }

      let message = `السلام عليكم، طلب جديد من (${CONFIG.storeName}):\n`;
      message += `------------------------\n`;
      for (const id in cart) {
        const item = CONFIG.items.find(i => i.id == id);
        if (item) {
          message += `• ${item.name} × ${cart[id]} = ${item.price * cart[id]} ج.م\n`;
        }
      }
      message += `------------------------\n`;
      message += `💰 *الإجمالي:* ${getCartStats().total} ج.م\n`;
      message += `💳 *طريقة الدفع:* ${payMethod}\n`;
      message += `👤 *الاسم:* ${name}\n`;
      message += `📍 *العنوان:* ${address}\n`;
      if (notes) message += `📝 *ملاحظات:* ${notes}\n`;

      const url = `https://wa.me/${CONFIG.whatsapp}?text=${encodeURIComponent(message)}`;
      window.open(url, "_blank");
    }

    renderCategories();
    renderMenu();
  </script>
</body>
</html>
